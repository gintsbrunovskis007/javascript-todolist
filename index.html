<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript ToDoList</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>JavaScript ToDoList</h1>

    <form id="task-form">
      <div>
        <div>
          <label for="task-input">Task</label>
          <input type="text" id="task-input" name="task-input" />
        </div>
        <div>
          <label for="task-priority-select">Priority</label>
          <select name="task-priority-select" id="task-priority-select">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label for="task-due-date-input">Due Date</label>
          <input
            type="date"
            name="task-due-date-input"
            id="task-due-date-input"
          />
        </div>
        <div>
          <label for="task-category-select">Category</label>
          <select id="task-category-select"></select>
        </div>
        <div style="display: flex">
          <label>Tags</label>
          <div id="task-tag-container"></div>
        </div>
        <div>
          <button type="submit" id="task-create-button">Create</button>
        </div>
      </div>
    </form>

    <div>
      <div>
        <h2>Active tasks <span id="active-task-count-span">(0)</span></h2>
      </div>
      <div style="display: flex">
        <span>Filter by</span>
        <select id="task-filter-by-select"></select>
        <select id="task-filter-specific-select"></select>

        <div id="task-filter-specific-container"></div>
      </div>
      <ul style="border: 3px solid black" id="filtered-task-list"></ul>

      <div>
        <ul id="active-task-list"></ul>
      </div>
    </div>
    <div>
      <div>
        <h2>Completed tasks <span id="completed-task-count-span">(0)</span></h2>
      </div>
      <div>
        <ul id="completed-task-list"></ul>
      </div>
    </div>

    <hr />
    <div>
      <h2>Search tasks</h2>
      <div>
        <div><input type="text" id="search-task-input" /></div>
        <div>
          <ul id="search-task-list"></ul>
        </div>
      </div>
    </div>

    <hr />
    <div><h2>Categories</h2></div>

    <form id="task-category-form">
      <div>
        <label for="task-category-input">Category</label>
        <input
          type="text"
          name="task-category-input"
          id="task-category-input"
        />
        <button type="submit" id="task-category-create-button">Create</button>
      </div>
    </form>

    <div>
      <ul id="task-category-list"></ul>
    </div>

    <hr />
    <div><h2>Tags</h2></div>
    <form id="task-tag-form">
      <div>
        <label for="task-tag-input">Tag</label>
        <input type="text" name="task-tag-input" id="task-tag-input" />
        <button type="submit" id="task-tag-create-button">Create</button>
      </div>
    </form>

    <div>
      <ul id="task-tag-list"></ul>
    </div>
  </body>
</html>
