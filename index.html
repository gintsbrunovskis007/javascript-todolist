<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript ToDoList</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>JavaScript ToDoList</h1>

    <form id="task-form">
      <div>
        <div>
          <label for="task-input">Task</label>
          <input type="text" id="task-input" name="task-input" />
        </div>
        <div>
          <label for="task-priority-select">Priority</label>
          <select name="task-priority-select" id="task-priority-select">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label for="task-due-date-input">Due Date</label>
          <input
            type="date"
            name="task-due-date-input"
            id="task-due-date-input"
          />
        </div>
        <div>
          <button type="submit" id="task-create-button">Create</button>
        </div>
      </div>
    </form>

    <div>
      <div>
        <h2>Active tasks <span id="active-task-count-span">(0)</span></h2>
      </div>
      <div>
        <ul id="active-task-list"></ul>
      </div>
    </div>
    <div>
      <div>
        <h2>Completed tasks <span id="completed-task-count-span">(0)</span></h2>
      </div>
      <div>
        <ul id="completed-task-list"></ul>
      </div>
    </div>

    <hr />
    <div>
      <h2>Search tasks</h2>
      <div>
        <div><input type="text" id="search-task-input" /></div>
        <div>
          <ul id="search-task-list"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
